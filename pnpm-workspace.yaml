  react-dom: 19.2.8
  react-hook-form: 7.89.0
  server-only: 0.0.1
  sonner: 2.0.8
  typescript: 6.0.3
  vitest: 5.0.0
  zod: 4.6.5

catalogMode: strict

# Targeted security overrides for transitive advisories with no direct patched
# range available to the parent (GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p,
# GHSA-q2hr-2g5m-vwhr, GHSA-68fv-2mgg-jv7q, GHSA-wq5f-xc86-pv6w). Each target is
# a patch-level bump inside the range the parent already accepts.
overrides:
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  source-map-js@<1.2.2: 1.2.2
  sharp@<0.35.5: 0.35.5

minimumReleaseAgeExclude:
  - "@supabase/ssr@0.12.6"
  - eslint@9.39.5
  - "@playwright/test@1.63.0"
  - playwright-core@1.63.0
  - playwright@1.63.0

onlyBuiltDependencies:
  - sharp
