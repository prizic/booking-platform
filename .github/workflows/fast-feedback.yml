name: Fast PR feedback

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-feedback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_PUBLIC_SITE_URL: "https://fast-feedback.invalid"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  FAST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  FAST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fast-feedback:
    name: Static and affected workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: fast-feedback-${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            fast-feedback-${{ runner.os }}-pnpm-

      - name: Cache the local Turborepo graph
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: fast-feedback-${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            fast-feedback-${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run fast feedback checks
        run: pnpm check:fast
