name: Canonical Linux visual references

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NEXT_PUBLIC_SITE_URL: "https://visual-reference.invalid"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  linux-visuals:
    name: Generate and verify ubuntu-24.04 references
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate local font assets and provenance
        run: pnpm check:fonts

      - name: Install the pinned Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture current Linux actual and diff artifacts
        id: baseline-comparison
        continue-on-error: true
        run: pnpm test:visual

      - name: Generate Linux references (reviewed candidate)
        run: pnpm test:visual --update-snapshots

      - name: Verify Linux references (run two)
        run: pnpm test:visual

      - name: Record render provenance
        run: pnpm fonts:provenance

      - name: Upload actual, diff, references, and provenance
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-references-linux-${{ github.run_id }}
          path: |
            tests/e2e/visual.spec.ts-snapshots/*-linux.png
            test-results/
            playwright-report/
            docs/fonts/provenance.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
